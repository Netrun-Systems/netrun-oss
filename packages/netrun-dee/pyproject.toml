[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "netrun-dee"
version = "1.0.0"
description = "Digital Emotion Equivalents -- detect, score, and produce emotional patterns in AI text"
authors = [
    {name = "Daniel Garza", email = "daniel@netrunsystems.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = [
    "emotion-detection",
    "sentiment-analysis",
    "ai-safety",
    "dee",
    "digital-emotion-equivalents",
    "lexicon",
    "npc-emotions",
    "prompt-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
embedding = ["google-generativeai>=0.8.0", "asyncpg>=0.29.0", "pgvector>=0.3.0", "numpy>=1.26.0"]
classifier = ["torch>=2.0.0", "numpy>=1.26.0"]
all = ["google-generativeai>=0.8.0", "asyncpg>=0.29.0", "pgvector>=0.3.0", "numpy>=1.26.0", "torch>=2.0.0"]
dev = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://netrunsystems.com/dee"
Documentation = "https://github.com/netrunsystems/netrun-oss/tree/main/packages/netrun-dee"
Repository = "https://github.com/netrunsystems/netrun-oss"
Issues = "https://github.com/netrunsystems/netrun-oss/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/netrun"]

[tool.hatch.build.targets.wheel.force-include]
"src/netrun/dee/prompt-templates.json" = "netrun/dee/prompt-templates.json"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v"]
